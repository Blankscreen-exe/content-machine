{% extends "manage/layout.html" %}
{% block section %}
<section class="panel">
  <h2>Piece types</h2>
  {% include "manage/type_list.html" %}

  <form class="inline-form" hx-post="/manage/types" hx-target="#type-list" hx-swap="outerHTML">
    <label class="inline">Name <input name="name" placeholder="newsletter" size="16" required></label>
    <label class="inline">Main file <input name="main_file" placeholder="newsletter.md" size="16" required></label>
    <button class="btn btn-primary" type="submit">Add type</button>
  </form>
  <p class="hint">The main file is the draft a piece of this type opens on and creates on its
    first save. Renaming a type is safe: existing pieces keep their folders.</p>
</section>
{% endblock %}
