<div id="brand-list">
  {% if brands %}
    <table class="list" id="brands-table" data-table>
      <thead><tr><th>Slug</th><th>Name</th><th>Status</th><th class="actions-head no-sort">Actions</th></tr></thead>
      <tbody>
        {% for brand in brands %}
          <tr class="{{ '' if brand.active else 'inactive' }}">
            <td data-label="Slug"><code>{{ brand.slug }}</code></td>
            <td data-label="Name" data-order="{{ brand.name | lower }}">
              <form class="inline-form" hx-post="/manage/brands/{{ brand.id }}"
                    hx-target="#brand-list" hx-swap="outerHTML">
                <input name="name" value="{{ brand.name }}" size="20" required>
                <button class="btn" type="submit">Rename</button>
              </form>
            </td>
            <td data-label="Status">{{ 'on' if brand.active else 'off' }}</td>
            <td class="actions-cell" data-label="Actions">
              <a class="btn" href="/manage/brands/{{ brand.id }}">Voice &amp; profile</a>
              <form class="inline-form" hx-post="/manage/brands/{{ brand.id }}/active"
                    hx-target="#brand-list" hx-swap="outerHTML">
                <input type="hidden" name="active" value="{{ 'false' if brand.active else 'true' }}">
                <button class="btn" type="submit">{{ 'Turn off' if brand.active else 'Turn on' }}</button>
              </form>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p class="empty">No brands yet. Add one below.</p>
  {% endif %}
</div>
