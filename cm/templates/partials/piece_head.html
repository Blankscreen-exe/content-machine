{# The top of a piece's page: its title and facts, and what can be done to it. Its details
   are edited on a page of their own; recording a publish redraws only the facts. #}
<section class="piece-head" id="piece-head">
  <div>
    <h2>{{ piece.title }}</h2>
    {% include "partials/piece_meta.html" %}
  </div>
  <div class="piece-actions">
    {% include "partials/derive_form.html" %}
    <a class="btn" href="/pieces/{{ piece.id }}/edit?next=/pieces/{{ piece.id }}">Edit details</a>
    <button class="btn btn-primary" hx-post="/pieces/{{ piece.id }}/session"
            hx-target="#session-message" hx-swap="innerHTML">Work on this</button>
  </div>
</section>
