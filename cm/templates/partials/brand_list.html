<div id="brand-list">
  {% if brands %}
    <table class="list">
      <thead><tr><th>Slug</th><th>Name</th><th>Status</th><th class="actions-head">Actions</th></tr></thead>
      <tbody>
        {% for brand in brands %}
          <tr class="{{ '' if brand.active else 'inactive' }}">
            <td data-label="Slug"><code>{{ brand.slug }}</code></td>
            <td data-label="Name">
              <form class="inline-form" hx-post="/brands/{{ brand.id }}"
                    hx-target="#brand-list" hx-swap="outerHTML">
                <input name="name" value="{{ brand.name }}" size="20">
                <button class="btn" type="submit">Rename</button>
              </form>
            </td>
            <td data-label="Status">{{ 'active' if brand.active else 'hidden' }}</td>
            <td class="actions-cell" data-label="Actions">
              <form hx-post="/brands/{{ brand.id }}/active" hx-target="#brand-list" hx-swap="outerHTML">
                <input type="hidden" name="active" value="{{ 'false' if brand.active else 'true' }}">
                <button class="btn" type="submit">{{ 'Hide' if brand.active else 'Show' }}</button>
              </form>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p class="empty">No brands yet. Add one below.</p>
  {% endif %}
</div>
