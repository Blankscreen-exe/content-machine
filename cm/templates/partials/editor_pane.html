<section class="editor-pane" id="editor-pane">
  <nav class="file-tabs">
    {% for other in names %}
      <a class="{{ 'on' if other == name }}"
         hx-get="/pieces/{{ piece.id }}/files/{{ other }}"
         hx-target="#editor-pane" hx-swap="outerHTML">{{ other }}</a>
    {% endfor %}
  </nav>

  <form hx-post="/pieces/{{ piece.id }}/files/{{ name }}"
        hx-target="#editor-pane" hx-swap="outerHTML">
    <input type="hidden" name="fingerprint" value="{{ fingerprint }}">
    <textarea class="draft" name="text" id="draft-text" spellcheck="true"
              data-piece-id="{{ piece.id }}"
              {{ 'readonly' if not editable }}>{{ text }}</textarea>

    <div class="actions">
      {% if editable %}
        <button class="btn btn-primary" type="submit">Save</button>
        {% if conflict %}
          <button class="btn btn-danger" type="submit" name="force" value="true"
                  hx-confirm="Overwrite the version on disk?">Save anyway</button>
          <a class="btn" hx-get="/pieces/{{ piece.id }}/files/{{ name }}"
             hx-target="#editor-pane" hx-swap="outerHTML">Reload from disk</a>
        {% endif %}
      {% else %}
        <span class="hint">{{ name }} is generated before every session and cannot be edited here.</span>
      {% endif %}

      <button class="btn" type="button" data-copy="markdown">Copy as markdown</button>
      <button class="btn" type="button" data-copy="plain">Copy as plain text</button>

      {% if message %}<span class="{{ 'message' if conflict else 'saved' }}">{{ message }}</span>{% endif %}
    </div>
  </form>
</section>
