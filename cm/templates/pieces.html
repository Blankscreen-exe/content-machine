{% extends "base.html" %}
{% block body %}

{% include "partials/masthead.html" %}
{% include "partials/brand_scope.html" %}

<div class="bar">
  <input class="search" type="search" name="q" placeholder="search drafts..." autocomplete="off"
         hx-get="/pieces/search" hx-trigger="input changed delay:300ms, search"
         hx-target="#search-results" hx-swap="outerHTML" hx-include="#brand-scope">
  <select name="stage"
          hx-get="/pieces/list" hx-trigger="change" hx-target="#pieces" hx-swap="outerHTML"
          hx-include="[name='type_id'],#brand-scope">
    <option value="">all stages</option>
    {% for value in stages %}
      <option value="{{ value }}" {{ 'selected' if stage == value }}>{{ value }}</option>
    {% endfor %}
  </select>
  <select name="type_id"
          hx-get="/pieces/list" hx-trigger="change" hx-target="#pieces" hx-swap="outerHTML"
          hx-include="[name='stage'],#brand-scope">
    <option value="">all types</option>
    {% for piece_type in types %}
      <option value="{{ piece_type.id }}" {% if type_id == piece_type.id %}selected{% endif %}>{{ piece_type.name }}</option>
    {% endfor %}
  </select>
  <span class="count" id="piece-count">{{ counts.get('total', 0) }} pieces &middot; {{ counts.get('published', 0) }} published</span>
  <button class="btn btn-primary" hx-get="/pieces/new?brand_id={{ brand_id or '' }}"
          hx-target="#piece-editor" hx-swap="innerHTML">New piece</button>
</div>

<div id="search-results"></div>
{% include "partials/pieces.html" %}

<div id="piece-editor"></div>

{% endblock %}
