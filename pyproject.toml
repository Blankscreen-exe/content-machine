[project]
name = "content-machine"
version = "0.1.0"
description = "Local content pipeline: idea pool, pieces, schedules and generation, all offline."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",        # HTTP API and validation
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",      # SQLAlchemy models with pydantic types
    "alembic>=1.13",         # schema migrations
    "jinja2>=3.1",           # server-rendered pages
    "python-multipart>=0.0.9",  # form posts from htmx
    "pydantic-settings>=2.4",
    "typer>=0.12",           # CLI
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",           # FastAPI TestClient
]

[project.scripts]
cm = "cm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
